      <rect class="cell" x="135" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="150" y="0" width="10" height="10" fill="#312e81" rx="2" />
      <rect class="cell" x="165" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="180" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="195" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="210" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="225" y="0" width="10" height="10" fill="#38bdf8" rx="2" />
      <rect class="cell" x="240" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="255" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="270" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="285" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="300" y="0" width="10" height="10" fill="#312e81" rx="2" />
      <rect class="cell" x="315" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="330" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="345" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="360" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="375" y="0" width="10" height="10" fill="#38bdf8" rx="2" />
      <rect class="cell" x="390" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="405" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="420" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="435" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="450" y="0" width="10" height="10" fill="#312e81" rx="2" />
      <rect class="cell" x="465" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="480" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="495" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="510" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="525" y="0" width="10" height="10" fill="#38bdf8" rx="2" />
      <rect class="cell" x="540" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="555" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="570" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="585" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="600" y="0" width="10" height="10" fill="#312e81" rx="2" />
      <rect class="cell" x="615" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="630" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="645" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="660" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="675" y="0" width="10" height="10" fill="#38bdf8" rx="2" />
      <rect class="cell" x="690" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="705" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="720" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
      <rect class="cell" x="735" y="0" width="10" height="10" fill="#06b6d4" rx="2" />
      <rect class="cell" x="750" y="0" width="10" height="10" fill="#38bdf8" rx="2" />
    </g>
  </g>

  <!-- Authentic Animated Pac-Man Character -->
  <g class="pacman-hero">
    <circle cx="0" cy="0" r="8" fill="#ffff00" />
    <polygon points="0,0 9,-4 9,4" fill="#000000" />
    <circle cx="1" cy="-4" r="1.2" fill="#000000" />
  </g>

  <!-- Authentic Ghosts (Blinky = Red, Pinky = Pink, Inky = Cyan) -->
  <g class="ghost-blinky">
    <path d="M -6,6 L -6,0 A 6,6 0 0,1 6,0 L 6,6 L 3,3 L 0,6 L -3,3 Z" fill="#ff0000" />
    <circle cx="-2" cy="-1" r="2" fill="#ffffff" />
    <circle cx="3" cy="-1" r="2" fill="#ffffff" />
    <circle cx="-1" cy="-1" r="1" fill="#0000ff" />
    <circle cx="4" cy="-1" r="1" fill="#0000ff" />
  </g>

  <g class="ghost-pinky">
    <path d="M -6,6 L -6,0 A 6,6 0 0,1 6,0 L 6,6 L 3,3 L 0,6 L -3,3 Z" fill="#ffb8ff" />
    <circle cx="-2" cy="-1" r="2" fill="#ffffff" />
    <circle cx="3" cy="-1" r="2" fill="#ffffff" />
    <circle cx="-1" cy="-1" r="1" fill="#0000ff" />
    <circle cx="4" cy="-1" r="1" fill="#0000ff" />
  </g>

  <g class="ghost-inky">
    <path d="M -6,6 L -6,0 A 6,6 0 0,1 6,0 L 6,6 L 3,3 L 0,6 L -3,3 Z" fill="#00ffff" />
    <circle cx="-2" cy="-1" r="2" fill="#ffffff" />
    <circle cx="3" cy="-1" r="2" fill="#ffffff" />
    <circle cx="-1" cy="-1" r="1" fill="#0000ff" />
    <circle cx="4" cy="-1" r="1" fill="#0000ff" />
  </g>
</svg>
