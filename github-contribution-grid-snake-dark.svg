<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <filter id="neonBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .arcade-bg { fill: #050811; rx: 10px; }
    .pac-wall { fill: #0b1329; stroke: #2121ff; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; filter: url(#neonBlueGlow); }
    .cell { rx: 2px; ry: 2px; }

    /* Keyframes for Pacman & Ghost Corridor Navigation */
    @keyframes pacmanCorridorMove {
      0%   { transform: translate(35px, 45px); }
      30%  { transform: translate(795px, 45px); }
      33%  { transform: translate(795px, 95px); }
      63%  { transform: translate(35px, 95px); }
      66%  { transform: translate(35px, 145px); }
      96%  { transform: translate(795px, 145px); }
      100% { transform: translate(35px, 45px); }
    }

    @keyframes blinkyCorridorMove {
      0%   { transform: translate(-5px, 45px); }
      30%  { transform: translate(755px, 45px); }
      33%  { transform: translate(755px, 95px); }
      63%  { transform: translate(-5px, 95px); }
      66%  { transform: translate(-5px, 145px); }
      96%  { transform: translate(755px, 145px); }
      100% { transform: translate(-5px, 45px); }
    }

    @keyframes pinkyCorridorMove {
      0%   { transform: translate(-35px, 45px); }
      30%  { transform: translate(725px, 45px); }
      33%  { transform: translate(725px, 95px); }
      63%  { transform: translate(-35px, 95px); }
      66%  { transform: translate(-35px, 145px); }
      96%  { transform: translate(725px, 145px); }
      100% { transform: translate(-35px, 45px); }
    }

    .pacman-runner { animation: pacmanCorridorMove 12s linear infinite; }
    .blinky-runner { animation: blinkyCorridorMove 12s linear infinite; }
    .pinky-runner  { animation: pinkyCorridorMove 12s linear infinite; }
  </style>

  <!-- Arcade Screen Frame -->
  <rect class="arcade-bg" width="850" height="180" />

  <!-- Outer Double Blue Wall Borders -->
  <rect class="pac-wall" x="10" y="10" width="830" height="160" rx="8" />
  <rect class="pac-wall" x="16" y="16" width="818" height="148" rx="6" />

  <!-- CLEAR OPEN CORRIDORS AT y=45, y=95, y=145 -->

  <!-- Wall Blocks Positioned Strictly ABOVE & BETWEEN Corridors -->
  <!-- Top Wall Row (y = 22 to 34) -->
  <rect class="pac-wall" x="35" y="22" width="120" height="12" rx="3" />
  <rect class="pac-wall" x="175" y="22" width="140" height="12" rx="3" />
  <rect class="pac-wall" x="335" y="22" width="180" height="12" rx="3" />
  <rect class="pac-wall" x="535" y="22" width="140" height="12" rx="3" />
  <rect class="pac-wall" x="695" y="22" width="120" height="12" rx="3" />

  <!-- Middle Wall Row 1 (y = 65 to 77) -->
  <rect class="pac-wall" x="35" y="65" width="180" height="12" rx="3" />
  <rect class="pac-wall" x="235" y="65" width="160" height="12" rx="3" />
  <rect class="pac-wall" x="415" y="65" width="200" height="12" rx="3" />
  <rect class="pac-wall" x="635" y="65" width="180" height="12" rx="3" />

  <!-- Middle Wall Row 2 (y = 115 to 127) -->
  <rect class="pac-wall" x="35" y="115" width="140" height="12" rx="3" />
  <rect class="pac-wall" x="195" y="115" width="200" height="12" rx="3" />
  <rect class="pac-wall" x="415" y="115" width="220" height="12" rx="3" />
  <rect class="pac-wall" x="655" y="115" width="160" height="12" rx="3" />

  <!-- Contribution Grid Cells inside Open Corridor 1 (y=45) -->
  <g transform="translate(35, 40)">
    <g fill="#161b22">
      <rect class="cell" x="0" y="0" width="10" height="10" fill="#312e81"/>
      <rect class="cell" x="16" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="32" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="48" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="64" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="80" y="0" width="10" height="10" fill="#38bdf8"/>
      <rect class="cell" x="96" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="112" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="128" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="144" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="160" y="0" width="10" height="10" fill="#312e81"/>
      <rect class="cell" x="176" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="192" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="208" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="224" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="240" y="0" width="10" height="10" fill="#38bdf8"/>
      <rect class="cell" x="256" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="272" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="288" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="304" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="320" y="0" width="10" height="10" fill="#312e81"/>
      <rect class="cell" x="336" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="352" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="368" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="384" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="400" y="0" width="10" height="10" fill="#38bdf8"/>
      <rect class="cell" x="416" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="432" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="448" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="464" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="480" y="0" width="10" height="10" fill="#312e81"/>
      <rect class="cell" x="496" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="512" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="528" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="544" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="560" y="0" width="10" height="10" fill="#38bdf8"/>
      <rect class="cell" x="576" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="592" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="608" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="624" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="640" y="0" width="10" height="10" fill="#312e81"/>
      <rect class="cell" x="656" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="672" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="688" y="0" width="10" height="10" fill="#8b5cf6"/>
      <rect class="cell" x="704" y="0" width="10" height="10" fill="#06b6d4"/>
      <rect class="cell" x="720" y="0" width="10" height="10" fill="#38bdf8"/>
      <rect class="cell" x="736" y="0" width="10" height="10" fill="#4c1d95"/>
      <rect class="cell" x="752" y="0" width="10" height="10" fill="#7c3aed"/>
      <rect class="cell" x="768" y="0" width="10" height="10" fill="#8b5cf6"/>
    </g>
  </g>

  <!-- Pac-Man Hero Moving along Open Hallways -->
  <g class="pacman-runner">
    <circle cx="0" cy="0" r="7" fill="#ffff00" filter="url(#neonBlueGlow)" />
    <polygon points="0,0 8,-4 8,4" fill="#050811" />
    <circle cx="1" cy="-3" r="1" fill="#050811" />
  </g>

  <!-- Blinky Red Ghost Chasing in Corridor -->
  <g class="blinky-runner">
    <path d="M -5,5 L -5,-1 A 5,5 0 0,1 5,-1 L 5,5 L 2.5,2.5 L 0,5 L -2.5,2.5 Z" fill="#ff0000" filter="url(#neonBlueGlow)" />
    <circle cx="-1" cy="-2" r="1.5" fill="#ffffff" />
    <circle cx="3" cy="-2" r="1.5" fill="#ffffff" />
    <circle cx="0" cy="-2" r="0.8" fill="#0000ff" />
    <circle cx="4" cy="-2" r="0.8" fill="#0000ff" />
  </g>

  <!-- Pinky Pink Ghost Chasing in Corridor -->
  <g class="pinky-runner">
    <path d="M -5,5 L -5,-1 A 5,5 0 0,1 5,-1 L 5,5 L 2.5,2.5 L 0,5 L -2.5,2.5 Z" fill="#ffb8ff" filter="url(#neonBlueGlow)" />
    <circle cx="-1" cy="-2" r="1.5" fill="#ffffff" />
    <circle cx="3" cy="-2" r="1.5" fill="#ffffff" />
    <circle cx="0" cy="-2" r="0.8" fill="#0000ff" />
    <circle cx="4" cy="-2" r="0.8" fill="#0000ff" />
  </g>
</svg>
