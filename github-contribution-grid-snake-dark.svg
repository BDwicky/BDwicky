<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <style>
    .bg { fill: #0c101d; rx: 8px; }
    .title { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #38bdf8; font-size: 14px; }
    .sub { font-family: 'Plus Jakarta Sans', sans-serif; fill: #94a3b8; font-size: 11px; }
    .cell { rx: 3px; ry: 3px; }
    
    /* Pacman / Snake Animation */
    @keyframes moveSnake {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(220px, 0px); }
      50% { transform: translate(440px, 40px); }
      75% { transform: translate(660px, 20px); }
      100% { transform: translate(800px, 0px); }
    }
    
    .pacman {
      animation: moveSnake 8s linear infinite;
      fill: #f59e0b;
    }
    
    @keyframes eatDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    
    .dot-active {
      animation: eatDot 1.5s ease-in-out infinite alternate;
    }
  </style>

