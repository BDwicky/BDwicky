<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <!-- Glowing Neon Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: #0c101d; rx: 12px; }
    .maze-outer { fill: none; stroke: #00d8f6; stroke-width: 2.5; filter: url(#neonGlow); }
    .maze-inner { fill: none; stroke: #8a4fff; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.8; }
    .maze-wall { fill: none; stroke: #1e293b; stroke-width: 4; rx: 4px; }
    .cell { rx: 3px; ry: 3px; }

    /* Keyframes for Pacman & Ghost Arcade Track Movement */
    @keyframes pacmanArcadeTrack {
      0% { transform: translate(0px, 0px); }
      30% { transform: translate(784px, 0px); }
      33% { transform: translate(784px, 20px); }
      63% { transform: translate(0px, 20px); }
      66% { transform: translate(0px, 40px); }
      96% { transform: translate(784px, 40px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes blinkyChase {
      0% { transform: translate(-40px, 0px); }
      30% { transform: translate(744px, 0px); }
      33% { transform: translate(744px, 20px); }
      63% { transform: translate(-40px, 20px); }
      66% { transform: translate(-40px, 40px); }
      96% { transform: translate(744px, 40px); }
      100% { transform: translate(-40px, 0px); }
    }

    @keyframes pinkyChase {
      0% { transform: translate(-70px, 0px); }
      30% { transform: translate(714px, 0px); }
      33% { transform: translate(714px, 20px); }
      63% { transform: translate(-70px, 20px); }
      66% { transform: translate(-70px, 40px); }
      96% { transform: translate(714px, 40px); }
      100% { transform: translate(-70px, 0px); }
    }

    .pacman-runner { animation: pacmanArcadeTrack 12s linear infinite; }
    .blinky-runner { animation: blinkyChase 12s linear infinite; }
    .pinky-runner { animation: pinkyChase 12s linear infinite; }
  </style>

  <!-- Arcade Card Outer Frame -->
  <rect class="bg" width="850" height="180" />

  <!-- Pacman Neon Arcade Track Borders -->
  <rect class="maze-outer" x="10" y="10" width="830" height="160" rx="10" />
  <path class="maze-inner" d="M 25,35 L 825,35 L 825,55 L 25,55 L 25,75 L 825,75" />

  <!-- Arcade Maze Title Header -->
  <text x="30" y="28" fill="#00d8f6" font-family="'Outfit', sans-serif" font-weight="700" font-size="12">
    🕹️ PAC-MAN ARCADE MAZE TRACK • LIVE CONTRIBUTION GRID
  </text>
  
  <g transform="translate(730, 28)" font-family="'Outfit', sans-serif" font-size="10">
    <circle cx="0" cy="-4" r="5" fill="#ef4444" />
    <text x="8" y="0" fill="#ef4444">Blinky</text>
    <circle cx="50" cy="-4" r="5" fill="#ec4899" />
    <text x="58" y="0" fill="#ec4899">Pinky</text>
  </g>

