<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="110">
  <style>
    .bg { fill: #0c101d; rx: 8px; }
    .cell { rx: 3px; ry: 3px; }
    
    /* Perfect Grid-Aligned Pacman Movement */
    @keyframes pacmanGridMove {
      0% { transform: translate(0px, 0px); }
      30% { transform: translate(784px, 0px); }
      33% { transform: translate(784px, 16px); }
      63% { transform: translate(0px, 16px); }
      66% { transform: translate(0px, 32px); }
      96% { transform: translate(784px, 32px); }
      100% { transform: translate(0px, 0px); }
    }
    
    /* Mouth Chomping Animation */
    @keyframes chomp {
      0%, 100% { d: path("M 12,6 L 3,1 A 6,6 0 1,1 3,11 Z"); }
      50% { d: path("M 12,6 L 0,6 A 6,6 0 1,1 12,6 Z"); }
    }

    .pacman-group {
      animation: pacmanGridMove 12s linear infinite;
    }
    
    .pacman-body {
      fill: #f59e0b;
      transform-origin: 6px 6px;
    }
  </style>

  <!-- Dark Cosmic Background Card -->
  <rect class="bg" width="850" height="110" />

