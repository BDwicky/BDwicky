<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="210">
  <defs>
    <!-- Classic Arcade Neon Glow -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .arcade-bg { fill: #000000; rx: 12px; }
    .pac-wall { fill: none; stroke: #2121ff; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; filter: url(#blueGlow); }
    .pac-wall-thin { fill: none; stroke: #2121ff; stroke-width: 1.5; filter: url(#blueGlow); }
    .ghost-door { stroke: #ffb8ff; stroke-width: 2; }
    .pellet { fill: #ffb8ae; }
    
    @keyframes powerBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .power-pellet { fill: #ffff00; animation: powerBlink 0.6s infinite; filter: url(#blueGlow); }

    /* Authentic Pac-Man Track Animations */
    @keyframes pacmanArcadePath {
      0% { transform: translate(45px, 45px); }
      30% { transform: translate(795px, 45px); }
      35% { transform: translate(795px, 105px); }
      65% { transform: translate(45px, 105px); }
      70% { transform: translate(45px, 165px); }
      95% { transform: translate(795px, 165px); }
      100% { transform: translate(45px, 45px); }
    }

    @keyframes ghostBlinky {
      0% { transform: translate(5px, 45px); }
      30% { transform: translate(755px, 45px); }
      35% { transform: translate(755px, 105px); }
      65% { transform: translate(5px, 105px); }
      70% { transform: translate(5px, 165px); }
      95% { transform: translate(755px, 165px); }
      100% { transform: translate(5px, 45px); }
    }

    @keyframes ghostPinky {
      0% { transform: translate(-25px, 45px); }
      30% { transform: translate(725px, 45px); }
      35% { transform: translate(725px, 105px); }
      65% { transform: translate(-25px, 105px); }
      70% { transform: translate(-25px, 165px); }
      95% { transform: translate(725px, 165px); }
      100% { transform: translate(-25px, 45px); }
    }

    @keyframes ghostInky {
      0% { transform: translate(-55px, 45px); }
      30% { transform: translate(695px, 45px); }
      35% { transform: translate(695px, 105px); }
      65% { transform: translate(-55px, 105px); }
      70% { transform: translate(-55px, 165px); }
      95% { transform: translate(695px, 165px); }
      100% { transform: translate(-55px, 45px); }
    }

    .pacman-hero { animation: pacmanArcadePath 12s linear infinite; }
    .ghost-blinky { animation: ghostBlinky 12s linear infinite; }
    .ghost-pinky { animation: ghostPinky 12s linear infinite; }
    .ghost-inky { animation: ghostInky 12s linear infinite; }
  </style>

  <!-- Black Arcade Screen Background -->
  <rect class="arcade-bg" width="850" height="210" />

  <!-- Outer Double Blue Wall Maze Border -->
  <rect class="pac-wall" x="12" y="12" width="826" height="186" rx="8" />
  <rect class="pac-wall" x="18" y="18" width="814" height="174" rx="6" />

  <!-- Maze Obstacle Blocks (Authentic Arcade T-Shapes & Rectangles) -->
  <path class="pac-wall" d="M 35,35 H 120 V 55 H 35 Z" />
  <path class="pac-wall" d="M 145,35 H 260 V 55 H 145 Z" />
  <path class="pac-wall" d="M 285,35 H 565 V 55 H 285 Z" />
  <path class="pac-wall" d="M 590,35 H 705 V 55 H 590 Z" />
  <path class="pac-wall" d="M 730,35 H 815 V 55 H 730 Z" />

  <!-- Middle Ghost House & Obstacles -->
  <path class="pac-wall" d="M 35,120 H 120 V 140 H 35 Z" />
  <path class="pac-wall" d="M 145,120 H 260 V 140 H 145 Z" />
  
  <!-- Ghost House Box (Center) -->
  <rect class="pac-wall" x="375" y="85" width="100" height="40" rx="4" />
  <line class="ghost-door" x1="410" y1="85" x2="440" y2="85" />
  
  <path class="pac-wall" d="M 590,120 H 705 V 140 H 590 Z" />
  <path class="pac-wall" d="M 730,120 H 815 V 140 H 730 Z" />

  <!-- Power Pellets at 4 Corners -->
  <circle class="power-pellet" cx="30" cy="30" r="5" />
  <circle class="power-pellet" cx="820" cy="30" r="5" />
  <circle class="power-pellet" cx="30" cy="180" r="5" />
  <circle class="power-pellet" cx="820" cy="180" r="5" />

  <!-- GitHub Contribution Grid Cells Overlayed in Corridor 1 (y=45) -->
  <g transform="translate(45, 65)">
    <g fill="#1e293b">
      <rect class="cell" x="0" y="0" width="10" height="10" fill="#312e81" rx="2" />
      <rect class="cell" x="15" y="0" width="10" height="10" fill="#4c1d95" rx="2" />
      <rect class="cell" x="30" y="0" width="10" height="10" fill="#7c3aed" rx="2" />
      <rect class="cell" x="45" y="0" width="10" height="10" fill="#8b5cf6" rx="2" />
